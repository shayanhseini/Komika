<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <title>Komika | کامیکا</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1424; overflow: hidden; touch-action: none; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0d1424; }
    #loading { position: fixed; inset: auto 0 12%; margin: auto; width: min(60vw, 320px); height: 6px;
      background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
    #loading > div { height: 100%; width: 0; background: #23e6ff; transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div></div></div>

  <!-- DroneVision engine: starts loading the pose model while Unity loads -->
  <script type="module" src="dronevision/unity-bridge.js"></script>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var bar = document.querySelector('#loading > div');
    // Weak GPUs: phones have 2-3x pixel density; rendering at full density costs
    // 4-9x the pixels for little visible gain. Cap it (the camera model is separate).
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.25 : 1.5);
    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: dpr,
    }, function (p) { bar.style.width = (100 * p) + '%'; })
    .then(function (instance) {
      window.unityInstance = instance;
      document.getElementById('loading').remove();
    })
    .catch(function (message) { alert(message); });
  </script>
</body>
</html>
